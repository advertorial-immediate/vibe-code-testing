x;text-align:center;color:var(--muted);border:1px dashed var(--stroke);border-radius:16px}.error{padding:13px;border:1px solid #893246;color:#ffd4dc;background:#36111b;border-radius:12px;margin-bottom:12px}@media(max-width:1100px){.app{grid-template-columns:1fr;gap:5px}.side,.side2{order:2;height:auto;padding:20px 20px 30px 20px}.main{order:1;height:auto;}.side2{display:block;margin-top:10px}.features{grid-template-columns:1fr 1fr}.hero{padding:120px 25px 20px 25px}.hero:after{right:auto;left:25px;font-size:80px}}@media(max-width:700px){.score-row{grid-template-columns:1fr}.team.away{justify-content:flex-start;text-align:left}.lineup-wrap,.mini,.features{grid-template-columns:1fr}.hero h1{font-size:34px}}input[type="date"] {

<script>
const state={fixtures:[],allFixtures:null,standings:[],teams:[],group:'all',team:'',date:new Date().toISOString().slice(0,10),selected:null,packs:{},view:'today'};
const els={date:document.getElementById('dateInput'),groups:document.getElementById('groupButtons'),team:document.getElementById('teamSelect'),matches:document.getElementById('matches'),lineups:document.getElementById('lineups'),standings:document.getElementById('standings'),news:document.getElementById('news'),status:document.getElementById('status'),errors:document.getElementById('errors'),insights:document.getElementById('insights'),heading:document.getElementById('heading')};
const flagOverrides={'England':'gb-eng','Scotland':'gb-sct','Wales':'gb-wls','Northern Ireland':'gb-nir','USA':'us','United States':'us','Korea Republic':'kr','South Korea':'kr','Iran':'ir','Czech Republic':'cz','Türkiye':'tr','Bosnia & Herzegovina':'ba'};
function countryCode(name){const map={'Mexico':'mx','South Africa':'za','Brazil':'br','Argentina':'ar','France':'fr','Spain':'es','Germany':'de','Portugal':'pt','Italy':'it','Netherlands':'nl','Belgium':'be','USA':'us','Canada':'ca','Japan':'jp','Morocco':'ma','England':'gb-eng','Uruguay':'uy','Colombia':'co','Croatia':'hr','Switzerland':'ch','Denmark':'dk','Senegal':'sn','Ghana':'gh','Ecuador':'ec','Iran':'ir','Australia':'au','Saudi Arabia':'sa','Qatar':'qa','Egypt':'eg','Norway':'no','Sweden':'se','Poland':'pl','Austria':'at','Chile':'cl','Peru':'pe','Tunisia':'tn','Algeria':'dz','Nigeria':'ng','South Korea':'kr','Czech Republic':'cz','Bosnia & Herzegovina':'ba','Haiti':'ht','Ivory Coast':'ci','New Zealand':'nz',
    'Paraguay':'py',
    'Iraq':'iq',
    'Congo DR':'cd',
    'DR Congo':'cd',
    'Cape Verde Islands':'cv',
    'Cape Verde':'cv',
    'Curaçao':'cw',
    'Curacao':'cw',
    'Uzbekistan':'uz',
    'Türkiye':'tr',
    'Turkey':'tr',
    'Jordan':'jo'};return map[name]||flagOverrides[name]||name.slice(0,2).toLowerCase()}
function flag(name){return `https://flagcdn.com/w80/${countryCode(name)}.png`}
function api(path){return fetch(path).then(r=>r.ok?r.json():r.json().then(e=>Promise.reject(e)))}
function fmtTime(s){return new Date(s).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}
function fmtDate(s){return new Date(s).toLocaleDateString([], {weekday:'short',day:'2-digit',month:'short'})}
function pct(n){return Math.max(1,Math.min(99,Math.round(n)))}
function formLetters(team,pack,side){const modelForm=side&&pack?.model?.form?.[side]; if(modelForm&&modelForm!=='TBC') return modelForm.slice(-5).split(''); const all=state.standings.flat();const r=all.find(x=>x.team?.id===team?.id||x.team?.name===team?.name);let f=(r?.form||'').slice(-5).split('').filter(Boolean);return f.length?f:['?','?','?','?','?']}
function scoreFromPack(f,pack){if(pack?.model?.score) return [pack.model.score.home,pack.model.score.away]; const p=pack?.prediction?.predictions; if(p?.goals?.home&&p?.goals?.away) return [Number.parseInt(p.goals.home)||1,Number.parseInt(p.goals.away)||1]; const homeRank=rankOf(f.teams.home), awayRank=rankOf(f.teams.away); const diff=(awayRank-homeRank)/18; const h=Math.max(0,Math.round(1.25+diff)); const a=Math.max(0,Math.round(1.05-diff)); return [h,a]}
function rankOf(t){const r=state.standings.flat().find(x=>x.team?.id===t?.id);return r?.rank||12}function isFinishedFixture(f) {
  const status = f?.fixture?.status?.short;

  return [
    'FT',   // Full Time
    'AET',  // After Extra Time
    'PEN'   // Penalties
  ].includes(status);
}
function predictionOutcome(
  predictedHome,
  predictedAway,
  actualHome,
  actualAway
) {
  if (
    predictedHome === actualHome &&
    predictedAway === actualAway
  ) {
    return '✅ Exact result';
  }

  const predictedResult =
    predictedHome > predictedAway
      ? 'H'
      : predictedHome < predictedAway
      ? 'A'
      : 'D';

  const actualResult =
    actualHome > actualAway
      ? 'H'
      : actualHome < actualAway
      ? 'A'
      : 'D';

  return predictedResult === actualResult
    ? ' ✓ Correct outcome'
    : ' ❌ Incorrect outcome';
}
function confidence(f,pack){const mp=pack?.model?.percent; if(mp) return Math.max(mp.home||0,mp.draw||0,mp.away||0); const p=pack?.prediction?.predictions?.percent; if(p){return Math.max(parseInt(p.home)||0,parseInt(p.draw)||0,parseInt(p.away)||0)} const d=Math.abs(rankOf(f.teams.home)-rankOf(f.teams.away));return pct(54+d*2)}
function groupOfTeam(t){for(const g of state.standings){if(g.some(r=>r.team?.id===t?.id)) return g[0]?.group || 'Group'} return 'Group'}
function flattenGroups(){return state.standings.map((g,i)=>({name:g[0]?.group||`Group ${String.fromCharCode(65+i)}`,rows:g}))}
function showError(e){els.errors.innerHTML=`<div class="error">${e.error||e.message||e}</div>`}
function clearPanels(){
  els.errors.innerHTML='';
  document.querySelectorAll('.inline-lineups').forEach(el => el.innerHTML = '');
}
let countdownTimer = null;

function startCountdown() {
  countdown();
  if (countdownTimer) clearInterval(countdownTimer);
  countdownTimer = setInterval(countdown, 1000);
}
function countdown() {

  const allFixtures = [
    ...(state.fixtures || []),
    ...(state.allFixtures || [])
  ];

  if (!allFixtures.length) return;

  const now = new Date();

  const upcoming = allFixtures
    .filter(f => new Date(f.fixture.date) > now)
    .sort((a,b) => new Date(a.fixture.date) - new Date(b.fixture.date));

  if (!upcoming.length) {
    document.getElementById('nextMatchTitle').innerHTML =
      'Tournament Complete';

    document.getElementById('countdown').innerHTML =
      '<div><b>00</b><span>DAYS</span></div>';

    return;
  }

  const nextMatch = upcoming[0];
  const target = new Date(nextMatch.fixture.date);

  const d = target - now;

  const days = Math.floor(d / 864e5);
  const hrs  = Math.floor((d % 864e5) / 36e5);
  const mins = Math.floor((d % 36e5) / 6e4);
  const secs = Math.floor((d % 6e4) / 1e3);

  document.getElementById('nextMatchTitle').innerHTML = `
    <div style="margin-bottom:10px;font-weight:700">
      <img class="smallflag" src="${flag(nextMatch.teams.home.name)}" style="margin-right:5px;">${nextMatch.teams.home.name}
      
      <span class="vs">vs</span>

      ${nextMatch.teams.away.name}<img class="smallflag" src="${flag(nextMatch.teams.away.name)}" style="margin-left:5px;">
    </div>
  `;

  document.getElementById('countdown').innerHTML =
    [
      ['DAYS',days],
      ['HRS',hrs],
      ['MINS',mins],
      ['SECS',secs]
    ]
    .map(x => `
  <div class="count-pill">
    <span class="count-value">
      ${String(x[1]).padStart(2,'0')}
    </span>
    <span class="count-label">

  return `<div class="pitch ${side}">
    <div class="formation-label">${formation}</div>
    ${players.map((p,i)=>{
      const [x,y] = positions[i] || [50,50];
      const name = p.player?.name || 'TBC';

      return `<div class="player" style="left:${x}%;top:${y}%">
        <div
  class="shirt"
  style="
    background:${shirtColour};
    color:${textColour};
  "
>
  ${p.player?.number || ''}
</div>
        <div>${name.split(' ').slice(-1)[0]}</div>
      </div>`;
    }).join('')}
  </div>`;
}
async function renderGroupsView(){els.heading.textContent='Groups';els.status.textContent='Loading group fixtures…';els.matches.innerHTML='<div class="loader">Loading full tournament fixture list…</div>';clearPanels();try{const fixtures=await loadSeasonFixtures();const groups=flattenGroups().filter(g=>state.group==='all'||g.name===state.group);els.status.textContent=`${groups.length} group${groups.length===1?'':'s'}`;els.matches.innerHTML=groups.map(g=>{const gf=fixtures.filter(f=>g.rows.some(r=>r.team.id===f.teams.home.id||r.team.id===f.teams.away.id));return `<section class="card"><h3>${g.name}</h3><div class="stand-row muted"><span></span><span>Team</span><span>P</span><span>GD</span><span>Pts</span></div>${g.rows.map(r=>`<div class="stand-row"><span>${r.rank}</span><span><img class="smallflag" src="${flag(r.team.name)}"> ${r.team.name}</span><span>${r.all?.played||0}</span><span>${r.goalsDiff||0}</span><b>${r.points||0}</b></div>`).join('')}<div class="fixture-list">${gf.slice(0,12).map(f=>`<div class="fixture-row"><span>${fmtDate(f.fixture.date)}</span><span><img class="smallflag" src="${flag(f.teams.home.name)}"> ${f.teams.home.name} v ${f.teams.away.name} <img class="smallflag" src="${flag(f.teams.away.name)}"></span><button class="ghost" onclick="jumpToFixture('${f.fixture.date.slice(0,10)}',${f.fixture.id})" style="text-align:center;padding:7px">View</button></div>`).join('')||'<p class="muted">No fixtures found for this group yet.</p>'}</div></section>`}).join('');renderStandings(12);}catch(e){showError(e);}}
async function renderTeamsView(){els.heading.textContent='Teams';els.status.textContent='Loading teams…';els.matches.innerHTML='<div class="loader">Building team cards…</div>';clearPanels();try{const fixtures=await loadSeasonFixtures();const rows=state.teams.map(x=>x.team).sort((a,b)=>a.name.localeCompare(b.name));els.status.textContent=`${rows.length} teams`;els.matches.innerHTML=`<div class="view-grid">${rows.map(t=>{const next=fixtures.filter(f=>f.teams.home.id===t.id||f.teams.away.id===t.id).sort((a,b)=>new Date(a.fixture.date)-new Date(b.fixture.date))[0];return `<div class="view-card" onclick="selectTeam(${t.id})"><div class="team-card"><img class="flag" src="${flag(t.name)}"><div><h3>${t.name}</h3><div class="muted">${groupOfTeam(t)}</div>${next?`<div class="muted">Next: ${fmtDate(next.fixture.date)} v ${next.teams.home.id===t.id?next.teams.away.name:next.teams.home.name}</div>`:'<div class="muted">No fixtures found</div>'}</div></div></div>`}).join('')}</div>`;}catch(e){showError(e);}}
window.selectTeam=function(id){scrollToTop();
els.team.value=String(id);state.team=String(id);state.group='all';setGroupButton('all');setView('dashboard');}
window.jumpToFixture=function(date,id){els.date.value=date;state.selected=id;setView('dashboard');setTimeout(()=>{const el=document.getElementById(`fixture-${id}`); if(el){el.scrollIntoView({behavior:'smooth',block:'center'}); el.click();}},900)}
async function renderStatsView(){els.heading.textContent='Stats & insights';els.status.textContent='Loading insights…';els.matches.innerHTML='<div class="loader">Analysing fixtures, groups and predictions…</div>';clearPanels();try{const fixtures=await loadSeasonFixtures();const played=fixtures.filter(f=>f.fixture.status?.short!=='NS').length;const upcoming=fixtures.length-played;const countries=new Set(fixtures.flatMap(f=>[f.teams.home.id,f.teams.away.id])).size;els.status.textContent='Tournament overview';els.matches.innerHTML=`<div class="metric-grid"><div class="metric"><span class="muted">Fixtures loaded</span><b>${fixtures.length}</b></div><div class="metric"><span class="muted">Upcoming</span><b>${upcoming}</b></div><div class="metric"><span class="muted">Teams seen</span><b>${countries}</b></div><div class="metric"><span class="muted">Groups</span><b>${flattenGroups().length}</b></div></div><div class="view-grid"><div class="view-card"><h3>Prediction model</h3><p class="muted">Uses API-Football prediction percentages when available, then blends standings rank, group context, injuries and weather indicators.</p></div><div class="view-card"><h3>Lineups</h3><p class="muted">Fixture lineups are pulled from API-Football when published. Before then, the pitch shows an estimated XI placeholder.</p></div><div class="view-card"><h3>Team news</h3><p class="muted">Injury and suspension data loads per selected fixture to limit API usage and keep the dashboard fast.</p></div></div>`;els.insights.innerHTML=`<div class="insight"><div class="icon">📊</div><div><b>Data source</b><br><span class="muted">API-Football league 1, season 2026.</span></div></div><div class="insight"><div class="icon">🌤️</div><div><b>Weather</b><br><span class="muted">Open-Meteo by venue city.</span></div></div>`;}catch(e){showError(e);}}
document.getElementById('applyBtn').onclick=()=>{state.view='dashboard';setActiveNav('dashboard');loadFixtures('Predictions')};document.getElementById('resetBtn').onclick=()=>{els.date.value=new Date().toISOString().slice(0,10);els.team.value='';state.team='';state.group='all';setGroupButton('all');setView('dashboard')};

function handleDateChange(input) {
  if (!input?.value) return;

  state.date = input.value;
  els.date.value = input.value;

  const dateInput2 = document.getElementById('dateInput2');
  if (dateInput2) dateInput2.value = input.value;

  state.view = 'today';
  state.team = '';
  state.group = 'all';

  els.team.value = '';
  setGroupButton('all');
  setActiveNav('today');

  input.blur();

  setTimeout(() => {
    document.activeElement?.blur?.();
    window.scrollTo(0, 0);
    loadFixtures('Predictions');
  }, 150);

  setTimeout(() => {
    window.scrollTo(0, 0);
  }, 600);
}

els.date.addEventListener('change', () => {
  closeMenu({ scroll: false });
  handleDateChange(els.date);
});

const dateInput2 = document.getElementById('dateInput2');

if (dateInput2) {
  dateInput2.addEventListener('change', () => {
    closeMenu({ scroll: false });
    handleDateChange(dateInput2);
  });
}

const menuToggle = document.getElementById('menuToggle');
const sideOverlay = document.getElementById('sideOverlay');
const sidePanel = document.querySelector('.side');
const side2 = document.querySelector('.side2');

function updateSide2() {
  if (!side2) return;
  side2.style.display = sidePanel.classList.contains('open') ? 'none' : '';
}

function closeMenu({ scroll = true } = {}) {
  sidePanel.classList.remove('open');
  sideOverlay.classList.remove('open');
  menuToggle.innerHTML = '☰';
  updateSide2();

  if (scroll) {
  setTimeout(scrollToTop, 300);
}
}

menuToggle.onclick = () => {
  const isOpen = sidePanel.classList.toggle('open');

  sideOverlay.classList.toggle('open', isOpen);
  menuToggle.innerHTML = isOpen ? '✕' : '☰';

  updateSide2();

  if (!isOpen) {
    scrollToTop();
  }
};

sideOverlay.onclick = () => closeMenu();

document.querySelectorAll('.side .nav button, .side .filter button').forEach(btn => {
  btn.addEventListener('click', () => {
    closeMenu({ scroll: true });
  });
});

document.querySelectorAll('.side input, .side select').forEach(el => {
  el.addEventListener('change', () => {
    closeMenu({ scroll: true });
  });
});

updateSide2();

function closeMenu() {
  sidePanel.classList.remove('open');
  sideOverlay.classList.remove('open');
  menuToggle.innerHTML = '☰';

  updateSide2();
}

sideOverlay.onclick = closeMenu;

document.querySelectorAll('.nav button, .filter button').forEach(btn => {
  btn.addEventListener('click', closeMenu);
});
init();
</script>

<script>
function openDatePicker(inputId = 'dateInput') {
  const input = document.getElementById(inputId);
  if (!input) return;

  input.focus();

  if (input.showPicker) {
    input.showPicker();
  }
}
</script>
</body>
